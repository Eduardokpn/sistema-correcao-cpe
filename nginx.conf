events {
  worker_connections 1024;
}

http {
  upstream cpe_dashboard {
    server dashboard:8501;
  }

  server {
    listen 80;
    server_name _;

    # Scanned sheets are uploaded through here; nginx's default limit is 1 MB,
    # which a single scan easily exceeds. Matches Streamlit's own 200 MB cap.
    client_max_body_size 200m;

    # The API is deliberately not proxied: it has no login, so it is reachable
    # only by the dashboard, inside the compose network.

    location / {
      proxy_pass http://cpe_dashboard;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 86400;
    }
  }
}
