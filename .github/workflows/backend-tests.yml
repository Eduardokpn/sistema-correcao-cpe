name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            back/requirements.txt
            back/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: App tests (db, grading, api)
        run: python -m pytest

      # The engine's tests and snapshots use paths relative to its own folder
      - name: OMR engine tests
        working-directory: back/omrchecker
        run: python -m pytest
